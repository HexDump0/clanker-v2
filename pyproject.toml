[project]
name = "clanker"
version = "0.1.0"
description = "clanker v2 — AI-assisted review bot for Hack Club Shipwrights certifications"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.1",
    "httpx>=0.28",
    "logfire>=3",
    "openai>=1.60",
    "playwright>=1.61.0",
    "pydantic>=2.10",
    "pydantic-ai>=2.13,<3",
    "pydantic-settings>=2.7",
    "slack-bolt>=1.23",
]

[project.scripts]
clanker = "clanker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clanker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# ASYNC240: flags one-shot Path.is_file/unlink calls in async code; the blocking
# time is microseconds and we don't want an anyio dependency for it.
ignore = ["ASYNC240"]
